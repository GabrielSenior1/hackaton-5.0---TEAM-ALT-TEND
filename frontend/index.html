<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KANKU — Plataforma de trazabilidad, comercio y turismo de Cacao, Café y Banano de la Sierra Nevada. En honor al pueblo Kankuamo." />
  <meta name="theme-color" content="#735c00" />
  <title>KANKU — Marketplace Sierra Nevada</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- SPA Root -->
  <div id="app">
    <!-- Loading State -->
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100dvh; gap: 24px; background: var(--background);">
      <div style="width: 64px; height: 64px; border-radius: 50%; background: var(--secondary-container); display: flex; align-items: center; justify-content: center; animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;">
        <span style="font-size: 32px;">🌿</span>
      </div>
      <div style="text-align: center;">
        <h1 style="font-family: 'Playfair Display', serif; font-size: 28px; color: var(--secondary); font-weight: 600;">KANKU</h1>
        <p style="font-family: 'Montserrat', sans-serif; font-size: 14px; color: var(--on-surface-variant); margin-top: 8px;">Cargando...</p>
      </div>
    </div>
  </div>

  <!-- App Entry Point -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
